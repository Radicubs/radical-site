<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>7503 robot camera bench</title>
    <style>
      :root { color-scheme: dark; --ink:#f3f7f3; --muted:#96a198; --line:rgba(231,244,232,.16); --green:#66ff55; }
      * { box-sizing:border-box; }
      body { margin:0; overflow:hidden; background:#070a08; color:var(--ink); font-family:Arial,sans-serif; }
      canvas { display:block; width:100vw; height:100vh; }
      .panel { position:fixed; left:20px; top:20px; width:min(280px,calc(100vw - 40px)); padding:18px; border:1px solid var(--line); border-radius:18px; background:rgba(7,11,8,.78); backdrop-filter:blur(18px); box-shadow:0 20px 60px rgba(0,0,0,.32); }
      h1 { margin:0; font-size:17px; letter-spacing:-.02em; }
      p { margin:7px 0 16px; color:var(--muted); font-size:12px; line-height:1.45; }
      .views { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
      .control { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px; margin-top:12px; color:var(--muted); font-size:11px; }
      input[type="range"] { accent-color:var(--green); width:100%; }
      .file-button { display:grid; place-items:center; min-height:35px; margin-top:12px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.045); color:var(--ink); cursor:pointer; font:600 12px/1 Arial,sans-serif; }
      .file-button:hover { background:rgba(102,255,85,.12); border-color:rgba(102,255,85,.65); }
      .file-button input { display:none; }
      button { min-height:35px; border:1px solid var(--line); border-radius:9px; background:rgba(255,255,255,.045); color:var(--ink); cursor:pointer; font:600 12px/1 Arial,sans-serif; transition:background .18s,border-color .18s,transform .18s; }
      button:hover,button:focus-visible { background:rgba(102,255,85,.12); border-color:rgba(102,255,85,.65); outline:none; transform:translateY(-1px); }
      button.active { background:var(--green); border-color:var(--green); color:#071007; }
      .status { position:fixed; right:20px; bottom:20px; max-width:min(370px,calc(100vw - 40px)); color:var(--muted); font:12px/1.45 ui-monospace,monospace; text-align:right; }
      .status strong { color:var(--green); font-weight:600; }
      @media (max-width:600px) { .panel{left:12px;top:12px;width:calc(100vw - 24px)} .status{right:12px;bottom:12px} }
    </style>
  </head>
  <body>
    <aside class="panel">
      <h1>7503 camera bench</h1>
      <p>Drag to orbit · scroll to zoom · use a preset to frame a subsystem.</p>
      <div class="views" id="views">
        <button data-view="assembled" class="active">Assembled</button>
        <button data-view="front">Front</button>
        <button data-view="top">Top</button>
        <button data-view="rear">Rear</button>
        <button data-view="intake">Intake</button>
        <button data-view="hopper">Hopper</button>
        <button data-view="shooter">Shooter</button>
        <button data-view="drivetrain">Drivetrain</button>
        <button data-view="electronics">Electronics</button>
      </div>
      <label class="control">Exposure <input id="exposure" type="range" min="0.75" max="1.8" step=".01" value="1.22" /></label>
      <label class="control">Explode <input id="explode" type="range" min="0" max="1" step=".01" value="0" /></label>
      <label class="file-button">Choose GLB for file-mode testing<input id="model-file" type="file" accept=".glb,model/gltf-binary" /></label>
    </aside>
    <div class="status" id="status">Loading textured v10 model…</div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
      import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/environments/RoomEnvironment.js';

      const status = document.querySelector('#status');
      const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.22;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#070a08');
      const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, .1, 1000);
      camera.position.set(11, -14, 10);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = .08;
      controls.minDistance = 3;
      controls.maxDistance = 45;

      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), .05).texture;
      pmrem.dispose();
      scene.add(new THREE.HemisphereLight(0xdce8e3, 0x0b1b0d, 1.6));
      const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(12,-10,18); key.castShadow = true; key.shadow.mapSize.set(2048,2048); key.shadow.bias = -.0002; scene.add(key);
      const rim = new THREE.DirectionalLight(0x66ff55, 1.2); rim.position.set(-14,12,8); scene.add(rim);
      const floor = new THREE.Mesh(new THREE.CircleGeometry(30,80), new THREE.MeshStandardMaterial({color:0x081109,roughness:.6,metalness:.32}));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
      const grid = new THREE.GridHelper(42, 42, 0x24572b, 0x122615); grid.material.opacity = .24; grid.material.transparent = true; scene.add(grid);

      let robot, size = 8;
      const movingParts = [];
      let targetPosition = new THREE.Vector3();
      let targetCamera = new THREE.Vector3();
      const candidates = {
        intake:['Intake_v78_1','Intake_v78'], hopper:['Extendable_Hopper_v19_1','Extendable_Hopper_v19'],
        shooter:['Shooter_v3_v42_1','Shooter_v3_v42'], electronics:['Electrical_Board_1','Electrical_Board']
      };
      const offsets = {
        assembled:[1.2,-1.45,.9], front:[0,-1.8,.15], top:[0,-.08,2.2], rear:[0,1.8,.2],
        intake:[-1.5,-1.6,.7], hopper:[1.6,-1.35,.8], shooter:[.4,-1.45,1.7], drivetrain:[0,-1.5,-1.3], electronics:[-.3,1.35,1.15]
      };
      function objectFor(view) {
        if (view === 'drivetrain') return robot;
        if (['assembled','front','top','rear'].includes(view)) return robot;
        return candidates[view].map(n => robot.getObjectByName(n)).find(Boolean) || robot;
      }
      function setView(view) {
        if (!robot) return;
        const node = objectFor(view); const box = new THREE.Box3().setFromObject(node);
        const center = box.getCenter(new THREE.Vector3()); const extent = box.getSize(new THREE.Vector3()).length() || size;
        const d = ['assembled','front','top','rear'].includes(view) ? size * 1.25 : Math.max(extent * 2.35, 4.2);
        targetPosition.copy(center).add(new THREE.Vector3(...offsets[view]).normalize().multiplyScalar(d));
        targetCamera.copy(center); controls.target.copy(center); camera.position.copy(targetPosition); camera.lookAt(center); controls.update();
        document.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        status.innerHTML = '<strong>' + view + '</strong> camera ready · drag to fine-tune';
      }
      function registerPart(names, offset) {
        const node = names.map(name => robot.getObjectByName(name)).find(Boolean);
        if (node) movingParts.push({ node, position:node.position.clone(), offset:new THREE.Vector3(...offset) });
      }
      function applyExplosion(amount) {
        movingParts.forEach(part => part.node.position.copy(part.position).addScaledVector(part.offset, amount));
      }
      function loadModel(url) {
        if (robot) scene.remove(robot);
        movingParts.length = 0;
        status.textContent = 'Loading model…';
        new GLTFLoader().load(url, gltf => {
        robot = gltf.scene; robot.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(robot); const center = box.getCenter(new THREE.Vector3());
        size = box.getSize(new THREE.Vector3()).length(); robot.position.sub(center); scene.add(robot);
        const aligned = new THREE.Box3().setFromObject(robot); floor.position.y = aligned.min.y - .03; grid.position.y = aligned.min.y - .02;
        robot.traverse(child => {
          if (!child.isMesh) return;
          child.castShadow = true; child.receiveShadow = true;
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach(material => { if (material.isMeshStandardMaterial) { material.envMapIntensity = 1.45; material.needsUpdate = true; } });
        });
        registerPart(candidates.intake,[-3.2,0,.2]); registerPart(candidates.hopper,[3.1,0,.25]);
        registerPart(candidates.shooter,[.2,0,3]); registerPart(candidates.electronics,[0,.2,-2.8]);
        setView('assembled');
        }, undefined, err => { status.textContent = 'Could not load model: ' + err.message; });
      }
      if (location.protocol === 'file:') {
        status.innerHTML = 'Opened from a local file. <strong>Choose GLB</strong> to load the robot.';
      } else {
        loadModel('/robot/models/2026-robot-v10-test.glb');
      }
      document.querySelector('#views').addEventListener('click', e => { const view = e.target.dataset.view; if (view) setView(view); });
      document.querySelector('#exposure').addEventListener('input', e => { renderer.toneMappingExposure = Number(e.target.value); });
      document.querySelector('#explode').addEventListener('input', e => applyExplosion(Number(e.target.value)));
      document.querySelector('#model-file').addEventListener('change', e => {
        const file = e.target.files && e.target.files[0];
        if (file) loadModel(URL.createObjectURL(file));
      });
      addEventListener('resize', () => { camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
      renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene,camera); });
    </script>
  </body>
</html>
